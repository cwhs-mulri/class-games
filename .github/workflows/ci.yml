name: 테스트
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: 보안 규칙 테스트(Firebase 에뮬레이터)
        run: |
          npm i --no-save --no-audit --no-fund @firebase/rules-unit-testing@4 firebase@10
          npx --yes firebase-tools emulators:exec --only database --project demo-class-games "node --test tests/rules/rules.test.mjs"
